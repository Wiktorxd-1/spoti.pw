name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        default: "https://cdn.wiktorxd-1.dev/f/wiktor/d/g0TdOmGDEhzuWRNC.ipa"
        required: false
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
  push:
    branches:
      - main

env:
  THEOS: ${{ github.workspace }}/theos
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-v2-${{ runner.os }}

      - uses: actions/checkout@v5
        if: steps.cache-theos.outputs.cache-hit != 'true'
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          fetch-depth: 1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/pipeline.sh') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Cache base IPA
        id: cache-ipa
        uses: actions/cache@v4
        with:
          path: ipa/spotify.ipa
          key: base-ipa-${{ inputs.ipa_url || 'https://cdn.wiktorxd-1.dev/f/wiktor/d/g0TdOmGDEhzuWRNC.ipa' }}

      - name: Cache Flag Table
        uses: actions/cache@v4
        with:
          path: tweak/Sources/Shared/Flags/SGFlagList.m
          key: flag-table-${{ inputs.ipa_url || 'https://cdn.wiktorxd-1.dev/f/wiktor/d/g0TdOmGDEhzuWRNC.ipa' }}

      - name: Download IPA
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url || 'https://cdn.wiktorxd-1.dev/f/wiktor/d/g0TdOmGDEhzuWRNC.ipa' }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Build modded release IPA
        run: make release

      - name: Create or update GitHub Release with modded IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA_FILE=$(ls out/Taurus*.ipa out/*.ipa 2>/dev/null | head -n 1)
          SPOTIFY_VERSION=$(python3 -c "
          import zipfile, plistlib, sys
          try:
            with zipfile.ZipFile('$IPA_FILE', 'r') as z:
              for name in z.namelist():
                if name.endswith('Spotify.app/Info.plist'):
                  plist = plistlib.loads(z.read(name))
                  print(plist.get('CFBundleShortVersionString', '9.1.90'))
                  sys.exit(0)
          except Exception:
            pass
          print('9.1.90')
          ")
          TAG="v${SPOTIFY_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$IPA_FILE" --title "Taurus ${SPOTIFY_VERSION}" --notes "Spotify with Taurus Liquid Glass UI and synced lyrics"
          else
            gh release upload "$TAG" "$IPA_FILE" --clobber
          fi

      - name: Generate apps.json for SideStore
        run: |
          IPA_FILE=$(ls out/Taurus*.ipa out/*.ipa 2>/dev/null | head -n 1)
          IPA_SIZE=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat -c%s "$IPA_FILE")
          SPOTIFY_VERSION=$(python3 -c "
          import zipfile, plistlib, sys
          try:
            with zipfile.ZipFile('$IPA_FILE', 'r') as z:
              for name in z.namelist():
                if name.endswith('Spotify.app/Info.plist'):
                  plist = plistlib.loads(z.read(name))
                  print(plist.get('CFBundleShortVersionString', '9.1.90'))
                  sys.exit(0)
          except Exception:
            pass
          print('9.1.90')
          ")
          VERSION="${SPOTIFY_VERSION}.${{ github.run_number }}"
          TAG="v${SPOTIFY_VERSION}"
          TODAY=$(date -u +"%Y-%m-%d")
          
          python3 -c "
          import json, os, glob
          repo = os.environ.get('GITHUB_REPOSITORY', 'Wiktorxd-1/spoti.pw')
          ipa_files = glob.glob('out/Taurus*.ipa') + glob.glob('out/*.ipa')
          ipa_name = os.path.basename(ipa_files[0]) if ipa_files else 'Taurus.ipa'
          download_url = f'https://github.com/{repo}/releases/download/${TAG}/{ipa_name}'
          data = {
            'name': 'Taurus',
            'identifier': 'pw.spoti.source',
            'subtitle': 'Liquid Glass UI for Spotify',
            'description': 'Liquid Glass UI for the decrypted Spotify iOS app with real-time synced lyrics, Sing vocal control, and Live Activity support.',
            'iconURL': 'https://raw.githubusercontent.com/Wiktorxd-1/spoti.pw/main/docs/icon.png',
            'website': 'https://spoti.pw',
            'tintColor': '1ED760',
            'apps': [
              {
                'name': 'Spotify',
                'bundleIdentifier': 'com.spotify.client',
                'developerName': 'Spotify & spoti.pw',
                'subtitle': 'Liquid Glass UI & Lyrics',
                'version': '${VERSION}',
                'versionDate': '${TODAY}',
                'versionDescription': 'Spotify ${VERSION} with Taurus Liquid Glass UI, real-time Live Activity lyrics, Quick Sing karaoke toggle, and scrubbing haptics.',
                'downloadURL': download_url,
                'localizedDescription': 'A complete Liquid Glass redesign for the Spotify iOS app. Includes Apple Music style real-time synced lyrics, Live Activity support in Dynamic Island & Lock Screen, vocal volume control (Sing), AMOLED dark mode, and seamless physical haptics.',
                'iconURL': 'https://raw.githubusercontent.com/Wiktorxd-1/spoti.pw/main/docs/icon.png',
                'tintColor': '1ED760',
                'size': int('${IPA_SIZE}')
              }
            ],
            'news': [
              {
                'appID': 'com.spotify.client',
                'title': 'Taurus ${VERSION}',
                'identifier': f'spoti-pw-${VERSION}-release',
                'caption': 'Spotify ${VERSION} Support & Live Activity Lyrics',
                'date': '${TODAY}',
                'tintColor': '1ED760',
                'notify': True,
                'url': 'https://github.com/Wiktorxd-1/spoti.pw'
              }
            ]
          }
          with open('apps.json', 'w') as f:
            json.dump(data, f, indent=2)
          with open('sidestore.json', 'w') as f:
            json.dump(data, f, indent=2)
          "
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json sidestore.json tweak/Sources/Shared/Flags/SGFlagList.m 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore(actions): update apps.json to $VERSION" && git push origin HEAD:main)

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: Taurus
          path: |
            out/Taurus*.ipa
            apps.json
            sidestore.json
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/Taurus*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"

