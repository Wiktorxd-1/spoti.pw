name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        default: "https://cdn.wiktorxd-1.dev/f/wiktor/d/gvZuQti06JoAU5nG.ipa"
        required: false
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
  push:
    branches:
      - main

env:
  THEOS: ${{ github.workspace }}/theos
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Syntax, layer, and logic check
        run: |
          python3 scripts/check-syntax.py

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-v2-${{ runner.os }}

      - uses: actions/checkout@v5
        if: steps.cache-theos.outputs.cache-hit != 'true'
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
          fetch-depth: 1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('scripts/pipeline.sh') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Cache Flag Table
        uses: actions/cache@v4
        with:
          path: tweak/Sources/Shared/Flags/SGFlagList.m
          key: flag-table-${{ inputs.ipa_url || 'https://cdn.wiktorxd-1.dev/f/wiktor/d/gvZuQti06JoAU5nG.ipa' }}

      - name: Cache base IPA
        id: cache-ipa
        uses: actions/cache@v4
        with:
          path: ipa/spotify.ipa
          key: base-ipa-${{ inputs.ipa_url || 'https://cdn.wiktorxd-1.dev/f/wiktor/d/gvZuQti06JoAU5nG.ipa' }}

      - name: Download IPA
        if: steps.cache-ipa.outputs.cache-hit != 'true'
        run: |
          mkdir -p ipa
          curl -fsSL "${{ inputs.ipa_url || 'https://cdn.wiktorxd-1.dev/f/wiktor/d/gvZuQti06JoAU5nG.ipa' }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Build modded release IPA
        run: make release

      - name: Create or update GitHub Release with modded IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA_FILE=$(ls out/Taurus*.ipa out/*.ipa 2>/dev/null | head -n 1)
          SPOTIFY_VERSION=$(python3 -c "
          import zipfile, plistlib, sys
          try:
            with zipfile.ZipFile('$IPA_FILE', 'r') as z:
              for name in z.namelist():
                if name.endswith('Spotify.app/Info.plist'):
                  plist = plistlib.loads(z.read(name))
                  print(plist.get('CFBundleShortVersionString', '9.1.90'))
                  sys.exit(0)
          except Exception:
            pass
          print('9.1.90')
          ")
          TAG="v${SPOTIFY_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$IPA_FILE" --title "Taurus ${SPOTIFY_VERSION}" --notes "Spotify with Taurus Liquid Glass UI and synced lyrics"
          else
            gh release upload "$TAG" "$IPA_FILE" --clobber
          fi

      - name: Generate apps.json and sidestore.json
        run: |
          IPA_FILE=$(ls out/Taurus*.ipa out/*.ipa 2>/dev/null | head -n 1)
          python3 scripts/generate-source.py "$IPA_FILE"

      - name: Merge remote upstream Taurus app
        run: |
          python3 -c "
          import json, urllib.request, os

          remote_url = 'https://r.wiktorxd-1.dev/taurus.json'

          try:
              req = urllib.request.Request(remote_url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req) as resp:
                  remote_data = json.loads(resp.read().decode('utf-8'))
          except Exception as e:
              print(f'::warning::Failed to fetch remote source {remote_url}: {e}')
              remote_data = None

          for file_name in ['apps.json', 'sidestore.json']:
              if not os.path.exists(file_name):
                  continue

              with open(file_name, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              apps = data.get('apps', [])
              if apps:
                  apps[0]['name'] = 'Spotify [Alpha]'

              if remote_data and 'apps' in remote_data and len(remote_data['apps']) > 0:
                  remote_app = remote_data['apps'][0].copy()
                  remote_app['name'] = 'Spotify'

                  existing_idx = next((i for i, a in enumerate(apps) if a.get('name') == 'Spotify'), None)
                  if existing_idx is not None:
                      apps[existing_idx] = remote_app
                  else:
                      apps.append(remote_app)

              data['apps'] = apps
              with open(file_name, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
          "

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json sidestore.json 2>/dev/null || true
          VERSION=$(python3 -c "import json; data=json.load(open('apps.json')); print(data['apps'][0]['versions'][0]['version'])")
          git diff --staged --quiet || (git commit -m "chore(actions): update source to $VERSION" && git push origin HEAD:main)

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: Taurus
          path: |
            out/Taurus*.ipa
            apps.json
            sidestore.json
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        continue-on-error: true
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/Taurus*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
